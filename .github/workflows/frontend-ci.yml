name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      # Only deployment runs on main.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get current ALB URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names myeventmap-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "ALB DNS: $ALB_DNS"

          echo "url=http://$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BACKEND_API_URL: ${{ steps.alb.outputs.url }}
        run: npm run build

      - name: Deploy frontend to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

      - name: Deployment summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Frontend deployed successfully!"
          echo "Backend API: ${{ steps.alb.outputs.url }}"
          echo "S3 bucket: ${{ secrets.S3_FRONTEND_BUCKET }}"